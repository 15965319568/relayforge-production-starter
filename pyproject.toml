[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relayforge"
version = "0.1.0"
description = "A production-shaped durable multi-tenant webhook platform"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
relayforge = "relayforge.cli:main"
relayforge-admin = "relayforge.admin_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
